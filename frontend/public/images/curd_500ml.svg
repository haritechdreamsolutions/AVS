<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7fee7"/>
      <stop offset="100%" stop-color="#d9f99d"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65a30d"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="200" cy="180" r="110" fill="#ffffff" opacity="0.6" filter="url(#shadow)"/>

  <!-- Product Graphics -->
  <g transform="translate(200, 175)" filter="url(#shadow)">
    
      <!-- Cup / Tub Graphic -->
      <path d="M-65,-60 L65,-60 L50,70 L-50,70 Z" fill="#ffffff"/>
      <rect x="-70" y="-70" width="140" height="15" fill="#4d7c0f" rx="6"/>
      <rect x="-60" y="-30" width="120" height="60" fill="#65a30d" opacity="0.15" rx="4"/>
      <text x="0" y="-8" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#4d7c0f" text-anchor="middle">Amirtha Curd</text>
      <rect x="-40" y="10" width="80" height="24" fill="#4d7c0f" rx="12"/>
      <text x="0" y="27" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">500ml</text>
      <text x="0" y="55" font-family="Arial, sans-serif" font-weight="800" font-size="11" fill="#666666" text-anchor="middle">500ml Tub</text>
    
  </g>

  <!-- Title Badge Footer -->
  <rect x="40" y="320" width="320" height="52" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  <text x="200" y="348" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#1e293b" text-anchor="middle">Amirtha Curd - 500ml</text>
  <text x="200" y="364" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#64748b" text-anchor="middle">500ml Tub</text>
</svg>