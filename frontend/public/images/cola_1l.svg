<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fecdd3"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="200" cy="180" r="110" fill="#ffffff" opacity="0.6" filter="url(#shadow)"/>

  <!-- Product Graphics -->
  <g transform="translate(200, 175)" filter="url(#shadow)">
    
      <!-- Bottle Graphic -->
      <rect x="-15" y="-105" width="30" height="20" fill="#881337" rx="4"/>
      <path d="M-20,-85 L20,-85 L35,-55 L35,80 L-35,80 L-35,-55 Z" fill="#be123c" opacity="0.9"/>
      <path d="M-30,-50 L30,-50 L30,60 L-30,60 Z" fill="#ffffff" opacity="0.95"/>
      <rect x="-30" y="-40" width="60" height="40" fill="#881337" rx="4"/>
      <text x="0" y="-18" font-family="Arial, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">COCCOLA COLA</text>
      <text x="0" y="32" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#881337" text-anchor="middle">1L</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-weight="800" font-size="10" fill="#444444" text-anchor="middle">1 Liter Jumbo Bottle</text>
    
  </g>

  <!-- Title Badge Footer -->
  <rect x="40" y="320" width="320" height="52" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  <text x="200" y="348" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#1e293b" text-anchor="middle">Coccola Cola - 1L</text>
  <text x="200" y="364" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#64748b" text-anchor="middle">1 Liter Jumbo Bottle</text>
</svg>