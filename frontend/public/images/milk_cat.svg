<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="200" cy="180" r="110" fill="#ffffff" opacity="0.6" filter="url(#shadow)"/>

  <!-- Product Graphics -->
  <g transform="translate(200, 175)" filter="url(#shadow)">
    
      <!-- Pouch Graphic -->
      <path d="M-60,-80 L60,-80 L75,80 L-75,80 Z" fill="#0284c7" rx="12"/>
      <path d="M-55,-75 L55,-75 L65,75 L-65,75 Z" fill="#ffffff" opacity="0.95"/>
      <!-- Header Band -->
      <rect x="-55" y="-75" width="110" height="35" fill="#0369a1" rx="4"/>
      <text x="0" y="-52" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">AMIRTHA MILK</text>
      <!-- Center Graphic -->
      <circle cx="0" cy="0" r="28" fill="#e0f2fe"/>
      <text x="0" y="8" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#0369a1" text-anchor="middle"></text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-weight="800" font-size="12" fill="#333333" text-anchor="middle">Fresh Pure Milk (200ml, 500ml, 1L)</text>
    
  </g>

  <!-- Title Badge Footer -->
  <rect x="40" y="320" width="320" height="52" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  <text x="200" y="348" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#1e293b" text-anchor="middle">Amirtha Milk </text>
  <text x="200" y="364" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#64748b" text-anchor="middle">Fresh Pure Milk (200ml, 500ml, 1L)</text>
</svg>