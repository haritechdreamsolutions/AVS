name: AVS CI / CD Automated Quality & Regression Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Full Quality Assurance & E2E Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avs_agencies_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root & Workspace Dependencies
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify TypeScript Compilation
        run: npx tsc --noEmit

      - name: Run Backend Logic & Unit Tests
        run: npm run test

      - name: Build Frontend Application
        run: npm --prefix frontend run build

      - name: Start Application Servers in Background
        env:
          NODE_ENV: test
          PORT: 5000
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: avs_agencies_db
          SESSION_SECRET: ci_test_secret_avs
        run: |
          node backend/index.js &
          npm --prefix frontend run preview -- --port 5173 --host &
          sleep 5

      - name: Run Smoke Tests
        run: npm run test:smoke

      - name: Run API Tests
        run: npm run test:api

      - name: Run Playwright E2E Tests
        run: npm run test:e2e

      - name: Upload Test Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
