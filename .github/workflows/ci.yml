
name: Production regression checks
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: [16,18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-bookworm
        env:
          POSTGRES_USER: avs_test_admin
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: avs_hardening_ci
        ports: ["55439:5432"]
        options: >-
          --health-cmd "pg_isready -U avs_test_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AVS_TEST_DATABASE_URL: postgresql://avs_test_admin@127.0.0.1:55439/avs_hardening_ci
      AVS_TEST_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm --prefix backend ci --ignore-scripts
      - run: npm --prefix frontend ci --ignore-scripts
      - run: npm test
      - run: node backend/test/production-backup.test.js
      - run: npx tsc --noEmit
      - run: node backend/test/production-security.test.js
      - run: node backend/test/production-billing.test.js
      - run: node backend/test/finalized-refund.test.js
      - run: node backend/test/production-reports.test.js
      - run: node backend/test/production-performance-reports.test.js
      - run: node backend/test/production-privileges.test.js
      - run: node backend/test/production-migrations.test.js
      - run: npm --prefix frontend run build
        env: {VITE_API_URL: /api}
      - run: node backend/test/native-production.test.js
      - run: npx playwright install --with-deps chromium
      - run: node backend/test/production-browser.test.js
      - run: npm audit --audit-level=moderate
      - run: npm --prefix backend audit --omit=dev --audit-level=moderate
      - run: npm --prefix frontend audit --audit-level=moderate
