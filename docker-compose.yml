version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: avs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-avs_agencies_db}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - avs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avs_agencies_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avs_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: ${PGDATABASE:-avs_agencies_db}
      SESSION_SECRET: ${SESSION_SECRET:-avs_production_super_secret_session_key}
    ports:
      - "5000:5000"

volumes:
  avs_pgdata:
    driver: local
